const header=(title,sub,controls='')=>`<div class="head"><div><h1>${title}</h1><p class="small">${sub}</p></div><div class="actions">${controls}</div></div><div class="flash" role="status">${escapeText(state.flash)}</div>`;

function showModal(title,body,footer=''){modal.innerHTML=`<div class="modalhead"><h2 id="modalTitle">${escapeText(title)}</h2>${btn('关闭','close')}</div><div class="modalbody">${body}</div><div class="modalfoot">${footer||btn('返回','close')}</div>`;modal.showModal();}
function closeModal(){modal.close();}
function typeName(c){return {business:'业务组件',dependency:'运行依赖',environment:'外部环境',candidate:'待开发'}[c.type]||'资源';}
function filtered(){return components.filter(c=>{const text=[c.name,name(c),c.description,c.provider,c.source,c.id,state.categories[c.id],...adaptedCaps(c).map(k=>k.name),...relations(c).map(r=>r.pkg?pluginName(r.pkg)+' '+r.pkg:r.name)].join(' ').toLowerCase();return(!state.query||text.includes(state.query.toLowerCase()))&&(state.type==='all'||c.type===state.type)&&(state.filter==='removed'?c.retired:!c.retired)&&(state.filter!=='pinned'||state.pins.has(c.id))&&(state.filter!=='pending'||c.type!=='dependency')&&(state.filter!=='candidate'||c.type==='candidate')&&(state.filter!=='unused'||c.type==='candidate');});}
function draw(){document.querySelectorAll('[data-route]').forEach(el=>el.classList.toggle('active',el.dataset.route===state.route));if(state.route==='center')drawCenter();if(state.route==='abilities')drawAbilities();if(state.route==='plugins')drawPlugins();if(state.route==='compose')drawCompose();main.classList.toggle('compact',main.clientWidth<1000);}
function drawCenter(){main.innerHTML=btn('← 能力中心','route','abilities')+header('组件中心','查找功能组件，查看来源、依赖与使用关系。',btn('＋ 添加组件','add')+btn('整理分类','classify')+btn('刷新','refresh'))+`<div class="toolbar"><input id="search" type="search" aria-label="搜索组件" placeholder="搜索组件名称、用途或提供插件" value="${escapeText(state.query)}"><select id="type" aria-label="资源类型">${[['business','业务组件'],['all','全部资源'],['dependency','运行依赖'],['environment','外部环境'],['candidate','待开发']].map(([v,n])=>`<option value="${v}" ${state.type===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="tabs" aria-label="组件快捷视图">${[['all','全部'],['pinned','收藏'],['pending','待就绪'],['unused','未使用'],['candidate','待开发'],['removed','回收站']].map(([v,n])=>`<button data-act="filter" data-value="${v}" aria-pressed="${state.filter===v}">${n}</button>`).join('')}</div>${state.scenario==='legacy'?'<div class="note warning">只读兼容模式：此情景模拟旧后端。新登记与保存需新版服务，原信息仍可查看。</div>':''}<div class="split ${state.showDetail?'showdetail':''}"><section class="list" aria-label="组件列表" id="list"></section><section class="detail" aria-label="组件详情" id="detail"></section></div>`;drawList();drawDetail();}
function drawList(){
 const rows=filtered(),el=document.getElementById('list');if(!el)return;
 el.innerHTML=`<div class="listhead small">${rows.length} 项示例资源 · 能力和插件分别展示</div>`+rows.map(c=>{
  const adapted=adaptedCaps(c),sources=sourcePlugins(c),supports=supportPlugins(c);
  const adaptation=adapted.length?adapted.map(k=>`<button class="relationchip abilitychip" data-act="showability" data-value="${c.id}|${k.id}" aria-label="查看适配能力：${escapeText(k.name)}（${escapeText(name(c))}）">${escapeText(k.name)} ↗</button>`).join(''):'<span class="small">'+(c.type==='candidate'?'待开发，尚无执行适配':c.type==='business'?'暂无已确认适配':'运行资源，不直接装配')+'</span>';
  const providers=sources.map(pkg=>`<button class="relationchip pluginchip" data-owner="${c.id}" data-act="plugin" data-value="${escapeText(pkg)}" aria-label="查看对应插件：${escapeText(pluginName(pkg))}（${escapeText(name(c))}）" title="${escapeText(pkg)}">${escapeText(pluginName(pkg))} ↗</button>`).join('')||'<span class="small">'+(c.type==='candidate'?'尚无实现来源':'服务或外部环境')+'</span>';
  return `<div class="item ${state.selected===c.id?'active':''}"><button class="select" data-act="select" data-value="${c.id}" aria-pressed="${state.selected===c.id}">${glyph(c.icon)}<span class="identity"><strong>${escapeText(name(c))}</strong><span class="small">${escapeText(c.source)} · ${typeName(c)}</span><span class="small">${escapeText(c.description)}</span>${c.retired?'<span class="badge">已退役</span>':''}</span></button><button class="pin" data-act="pin" data-value="${c.id}" aria-label="收藏 ${escapeText(name(c))}" title="收藏" aria-pressed="${state.pins.has(c.id)}">${pinIcon}</button><div class="rowlinks"><div class="chipline"><span class="chiplabel">适配 ${adapted.length} 项</span>${adaptation}</div><div class="chipline"><span class="chiplabel">对应插件 ${sources.length} 个</span>${providers}</div>${supports.length?`<button class="supportlink" data-act="showsources" data-value="${c.id}">运行支持插件 ${supports.length} 项 →</button>`:''}</div></div>`;
 }).join('')||'<div class="empty">没有匹配组件。清除搜索或调整筛选。</div>';
}
function detailTabs(){return[['overview','概览'],['actions','动作'],['config','配置与状态'],['sources','插件与依赖'],['refs','使用关系'],['versions','版本与变更']].map(([v,n])=>`<button role="tab" id="tab-${v}" aria-controls="detailPanel" tabindex="${state.tab===v?'0':'-1'}" aria-selected="${state.tab===v}" data-act="tab" data-value="${v}">${n}</button>`).join('');}
function drawDetail(){const el=document.getElementById('detail'),c=byId(state.selected);if(!el)return;if(!c||!filtered().some(r=>r.id===c.id)){el.innerHTML='<div class="empty">从当前列表选择组件查看详情。</div>';return;}const editable=state.scenario!=='legacy';el.innerHTML=btn('← 返回组件列表','listback','','compactreturn')+`<div class="detailhead">${glyph(c.icon)}<div><h2>${escapeText(name(c))}</h2><span class="small">${escapeText(c.source)} · ${typeName(c)}</span><div class="actions">${btn('整理信息','edit',c.id)}${c.type==='business'&&!c.retired?`<button class="primary" data-act="attach" data-value="${c.id}" ${!editable?'disabled':''}>添加到能力</button>`:''}${btn('更多操作','lifecycle',c.id)}</div></div></div><div class="tabs" role="tablist" aria-label="组件详情选项卡">${detailTabs()}</div><div role="tabpanel" id="detailPanel" aria-labelledby="tab-${state.tab}">${detailBody(c)}</div>`;}
function relations(c){return [...(c.provider?[{kind:c.type==='dependency'?'资源来源':'主实现',pkg:c.provider,name:pluginName(c.provider)}]:[]),...(c.deps||[])];}

// Preview metadata is a subset of the existing default taxonomy. Actual saved assignments take precedence in production.
const previewModules=[{id:'core-2',name:'会话、存储与记录',icon:'chat'},{id:'core-4',name:'Agent 执行与上下文',icon:'agent'},{id:'core-8',name:'技能、指令与预设',icon:'grid'}];
const previewFacts={
 '@deepseek-ai/dsh-session':{moduleId:'core-2',purpose:'管理会话及其事件记录'},
 '@deepseek-ai/dsh-agent':{moduleId:'core-4',purpose:'Agent 注册、启动范围和运行事件的基础服务'},
 '@deepseek-ai/dsh-tools':{moduleId:'core-4',purpose:'统一登记工具并执行工具调用'},
 '@deepseek-ai/dsh-skill':{moduleId:'core-8',purpose:'统一登记技能来源'}
};
const relationRole=r=>({'主实现':'功能提供','适配插件':'工作台适配','支持插件':'运行支持','资源来源':'资源来源'}[r.kind]||'关系待核实');
const treeIcon=kind=>`<svg viewBox="0 0 24 24" aria-hidden="true">${kind==='inbox'?'<path d="M5 4h14l3 14H2zM3 13h5l2 3h4l2-3h5"/>':kind==='layers'?'<path d="m12 3 10 6-10 6L2 9zM2 13l10 6 10-6M2 17l10 6 10-6"/>':kind==='chat'?'<path d="M4 4h16v13H9l-5 4zM7 8h10M7 12h7"/>':kind==='agent'?'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4m6-4v4M9 18v4m6-4v4M2 9h4m-4 6h4M18 9h4m-4 6h4"/>':'<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/>'}</svg>`;
function declaredPluginEntries(c){
 const map=new Map();
 for(const item of c?[c]:components.filter(x=>x.type==='business'))for(const r of relations(item).filter(r=>r.pkg)){
  const module=r.module||r.pkg,key=module;
  if(!map.has(key))map.set(key,{key,pkg:r.pkg,module,roles:[],edges:[],moduleId:previewFacts[module]?.moduleId||'',purpose:previewFacts[module]?.purpose||(r.kind==='主实现'?item.description:r.kind==='支持插件'?pluginName(r.pkg)+'，具体职责待核实':r.name||pluginName(r.pkg))});
  const entry=map.get(key);if(!entry.roles.includes(relationRole(r)))entry.roles.push(relationRole(r));entry.edges.push({component:item,relation:r});
 }
 return [...map.values()];
}
function sourceView(key){return state.sourceViews[key]||(state.sourceViews[key]={query:'',opened:{undefined:true,core:true},details:{}});}
function pluginCard(entry,component,view){
 const short=entry.pkg===browserPkg?pluginName(entry.pkg):entry.module.replace(/^@deepseek-ai\/(?:dsh-)?/,'').replace(/^@linxin666\/dsh-/,'');
 const linked=[...new Map(entry.edges.map(e=>[e.component.id,e.component])).values()];
 const direct=linked.filter(c=>entry.edges.some(e=>e.component.id===c.id&&e.relation.kind!=='支持插件'));
 const supported=linked.filter(c=>entry.edges.some(e=>e.component.id===c.id&&e.relation.kind==='支持插件'));
 const abilityCount=rows=>new Set(rows.flatMap(c=>adaptedCaps(c).map(k=>k.id))).size;
 const footer=component?(direct.length?`关联当前组件 · 适配能力 ${abilityCount(direct)} 项`:`支持当前组件 · 支撑能力 ${abilityCount(supported)} 项`):`关联组件 ${direct.length} · 支持组件 ${supported.length}`;
 const detailKey='identity:'+entry.key,relationKey='relation:'+entry.key;
 return `<article class="compact-plugin" data-module="${escapeText(entry.module)}" data-focused="${state.route==='plugins'&&state.pluginFocus===entry.module}"><details data-tree-detail="${escapeText(detailKey)}" ${view.details[detailKey]?'open':''}><summary><strong>${escapeText(short)}</strong><span class="plugin-status">未检测</span></summary><dl><dt>完整包名</dt><dd class="mono">${escapeText(entry.pkg)}</dd><dt>导出模块</dt><dd class="mono">${escapeText(entry.module)}</dd><dt>加载条目</dt><dd>未读取 entryId 与实例范围</dd><dt>分类依据</dt><dd>${entry.moduleId?'现有默认分类示例':'未匹配分类；等待真实清单核对'}</dd></dl><div class="actions">${btn('定位插件 ↗','locateentry',entry.module)}</div></details><p class="purpose" title="${escapeText(entry.purpose)}">${escapeText(entry.purpose)}</p><div class="roles">${entry.roles.map(role=>`<span class="role-tag">${escapeText(role)}</span>`).join('')}</div><details class="relation-details" data-tree-detail="${escapeText(relationKey)}" ${view.details[relationKey]?'open':''}><summary>${footer}</summary>${entry.edges.map(edge=>`<p class="relation-line"><strong>${escapeText(name(edge.component))}</strong><small>${escapeText(relationRole(edge.relation))} · ${edge.relation.kind==='支持插件'?'支持该组件运行；动作级职责待补齐':edge.relation.kind==='适配插件'?'接入工作台浏览器执行流程':edge.relation.kind==='资源来源'?'提供此运行资源':'声明提供该组件功能'}</small><small>${edge.relation.kind==='支持插件'?'支撑':'适配'}能力：${adaptedCaps(edge.component).map(k=>escapeText(k.name)).join('、')||'不直接装配'}</small></p>`).join('')}<p class="plugin-tree-note">依据组件声明；安装、加载及岗位和会话引用尚未读取。</p><div class="actions">${component?btn('查看使用关系','tab','refs'):linked.map(c=>btn('查看组件 ↗','showsources',c.id)).join('')}</div></details></article>`;
}
function renderPluginTree(entries,component,key){
 const view=sourceView(key),query=view.query.trim().toLowerCase();
 const matched=entries.filter(e=>!query||[e.module,e.pkg,e.purpose,...e.roles,previewModules.find(m=>m.id===e.moduleId)?.name,e.moduleId?'底层插件':'未定义区'].join(' ').toLowerCase().includes(query));
 const branch=(id,title,rows,children,icon,hint='',level='group')=>{
  if(!rows.length)return '';const open=query?true:!!view.opened[id];
  return `<section class="plugin-branch ${level==='module'?'plugin-module':''}" data-tone="${id==='undefined'?'amber':'blue'}" data-open="${open}"><button class="branch-button" data-act="treebranch" data-value="${escapeText(key+'|'+id)}" aria-expanded="${open}" aria-controls="tree-${id}"><span class="branch-icon">${treeIcon(icon)}</span><span class="branch-label"><strong>${escapeText(title)}</strong>${hint?`<small>${hint}</small>`:''}</span><span class="branch-count">${query?rows.length+' / '+entries.filter(e=>id==='undefined'?!e.moduleId:id==='core'?!!e.moduleId:e.moduleId===id).length:rows.length} 项</span><span class="branch-chevron" aria-hidden="true">›</span></button>${open?`<div class="branch-children" id="tree-${id}">${children}</div>`:''}</section>`;
 };
 const cards=rows=>`<div class="plugin-grid">${rows.map(e=>pluginCard(e,component,view)).join('')}</div>`;
 const undefinedRows=matched.filter(e=>!e.moduleId),coreRows=matched.filter(e=>e.moduleId);
 const moduleRows=previewModules.filter(m=>coreRows.some(e=>e.moduleId===m.id));
 const modules=moduleRows.map(m=>{const rows=coreRows.filter(e=>e.moduleId===m.id);return branch(m.id,m.name,rows,cards(rows),m.icon,'','module');}).join('');
 return `<div class="plugin-tree" data-tree-view="${escapeText(key)}">${branch('undefined','未定义区',undefinedRows,cards(undefinedRows),'inbox','尚未匹配现有分类')}${branch('core','底层插件',coreRows,`<div class="module-grid">${modules}</div>`,'layers',`${moduleRows.length} 个相关功能模块`)}${!matched.length?'<div class="plugin-empty">没有匹配的相关插件。清空搜索后查看全部相关项。</div>':''}</div>`;
}
function sourcesBody(c){
 const entries=declaredPluginEntries(c),resources=relations(c).filter(r=>!r.pkg),key='component:'+c.id,view=sourceView(key),packageCount=new Set(entries.map(e=>e.pkg)).size;
 if(!entries.length&&!resources.length)return '<div class="note">待开发组件尚无实现来源或依赖声明。</div>';
 return `<div class="plugin-scopebar"><strong>当前组件相关插件</strong><span class="small">${packageCount} 个包 · ${entries.length} 项模块声明</span>${btn('在插件管理中查看 ↗','managerrelated',c.id)}</div>${entries.length?`<input class="plugin-search" id="sourceSearch" aria-label="搜索当前组件相关插件" placeholder="搜索插件、用途、模块或关系角色" value="${escapeText(view.query)}">${renderPluginTree(entries,c,key)}`:'<p class="small">尚无插件关系登记。</p>'}${resources.length?`<details class="service-folder" data-service-id="${c.id}" ${view.services?'open':''}><summary>服务与环境 ${resources.length} 项</summary>${resources.map(r=>`<div class="service-row"><div class="spread"><strong>${escapeText(r.name)}</strong>${btn('查看说明','resourceinfo',c.id+'|'+r.name)}</div><span class="small">${escapeText(r.kind)} · ${r.suggested?'待补足关系登记':'当前组件条件声明'} · 未检测</span></div>`).join('')}</details>`:''}<p class="plugin-tree-note">沿用插件管理的分类，仅展示当前组件相关项。分类示例不代表正式清单状态。</p>`;
}
function showAbilityRelation(componentId,capabilityId){const c=byId(componentId),k=caps.find(x=>x.id===capabilityId);if(!c||!k)return;showModal('查看适配能力关系',`<p class="small">适配表示组件支持此能力流程，是否启用或已装配另行展示。</p><div class="relation"><strong>${escapeText(name(c))} → ${escapeText(k.name)}</strong><p>适配范围：${k.demo?'合成情景示例':'既有描述与流程范围示例'}</p><p>草稿：${k.draft.some(p=>p.id===c.id)?'包含当前组件':'未包含当前组件'} · 发布 v${k.version}：${k.published.some(p=>p.id===c.id)?'包含':'未包含'}</p><p class="small">来源插件：${sourcePlugins(c).map(pluginName).map(escapeText).join('、')}</p></div>`,btn('返回组件列表','close')+btn('打开此能力组合 ↗','openability',k.id));}
function detailBody(c){if(state.tab==='overview')return `<p>${escapeText(c.description)}</p><div class="kv"><span>组件 ID</span><span class="mono">${c.id}</span></div><div class="kv"><span>使用范围</span><span>${escapeText(c.scope)}</span></div><div class="kv"><span>原名称</span><span>${escapeText(c.name)}</span></div><div class="kv"><span>整理分类</span><span>${escapeText(state.categories[c.id]||'未分类')}</span></div><div class="kv"><span>备注</span><span>${escapeText(state.notes[c.id]||'尚无备注')}</span></div><div class="note">${c.type==='business'?'编辑整理信息不改变动作或执行权限。添加到能力后先保存草稿，再检查发布。':c.type==='candidate'?'此项只有需求登记。完成真实适配与验证后，才能成为可装配业务组件。':'资源参与依赖检查，通过真实配置或环境入口管理，不直接拖入业务组合。'}</div>`;
 if(state.tab==='actions')return c.actions.length?c.actions.map(a=>`<div class="relation"><strong>${escapeText(actionNames[a])}</strong><p class="small mono">${a}</p><p class="small">已适配动作。具体任务仍须通过岗位、能力版本及任务权限检查。</p></div>`).join(''):'<div class="note">当前资源没有可装配业务动作。</div>';
 if(state.tab==='config')return `<div class="kv"><span>来源状态</span><span>未读取正式安装和加载状态</span></div><div class="kv"><span>配置与检测</span><span>${escapeText(c.status||'尚无执行实现')}</span></div><div class="kv"><span>任务结果</span><span>本草图未执行实际任务</span></div><div class="note">服务配置与能力草稿分别保存。检测结果需要实际环境和时间，不能因地址已填写就显示连通。</div>${c.type==='business'?btn(c.id.startsWith('developer')?'项目设置入口':'配置服务入口','config',c.id):''}`;
 if(state.tab==='sources')return sourcesBody(c);
 if(state.tab==='refs'){const used=visibleCaps().filter(k=>k.draft.some(p=>p.id===c.id)||k.published.some(p=>p.id===c.id));return `<p class="small">以下为原型引用示例，未读取正式岗位和任务。</p>`+used.map(k=>`<div class="relation"><strong>${k.name}</strong><p>草稿：${k.draft.some(p=>p.id===c.id)?'已关联':'已移除'} · 发布 v${k.version}：${k.published.some(p=>p.id===c.id)?'包含组件':'未包含'}</p>${btn('打开能力组合','compose',k.id)}</div>`).join('')+(!used.length?'<div class="note">本原型没有引用此组件的能力示例。正式删除仍须检查所有历史引用。</div>':'<div class="note">正式界面继续展开岗位当前与历史版本、活动任务和历史任务，并按真实模块提供操作。</div>');}
 return `<div class="kv"><span>登记协议</span><span>${c.type==='candidate'?'待开发登记':'既有协议示例 v1'}</span></div><div class="kv"><span>实际加载代码</span><span>未检测，不能由登记版本推断</span></div><div class="kv"><span>生命周期</span><span>${c.retired?'已退役':c.type==='candidate'?'待开发':'现有登记示例'}</span></div><div class="note">协议版本与插件构建分别记录。升级提供包需要同时检查它提供的所有组件和旧协议引用。</div>${btn(c.retired?'恢复组件':'退役组件','retire',c.id)} ${c.type==='candidate'?btn('永久删除登记','purge',c.id,'danger'):''}`;
}
function drawAbilities(){main.innerHTML=header('能力中心','原型仅展示既有能力类型，不读取正式配置。',btn('组件中心','route','center'))+`<div class="cards">${visibleCaps().map(k=>`<article class="card"><h2>${k.name}</h2><p class="small">发布版本示例 v${k.version} · ${k.published.length} 个业务组件</p><p>草稿与发布组合分别维护。</p>${btn('管理组件组合','compose',k.id)}</article>`).join('')}</div>`;}

function drawPlugins(){
 const c=state.pluginContext?byId(state.pluginContext):null,entries=declaredPluginEntries(c),key='manager:'+(c?.id||'all'),view=sourceView(key);
 if(state.pluginFocus){const focused=entries.find(e=>e.module===state.pluginFocus);if(focused)view.opened[focused.moduleId||'undefined']=true;}
