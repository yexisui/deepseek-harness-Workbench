function renderCode(){const files=visibleFiles();if(!files.find(f=>f.id===state.selected))state.selected=files[0]?.id;const f=files.find(f=>f.id===state.selected);let scopeText={round:'第 '+state.round+' 轮开始快照 → 第 '+state.round+' 轮结束快照',task:'任务起点快照 → 当前文件内容',working:'HEAD / 暂存区 / 工作目录',branch:'共同起点 a58f72b → 当前 HEAD e3a96c1（示例）'}[state.scope];let fileHtml='';const groups=state.scope==='working'?['working','staged','untracked']:['all'];for(const g of groups){const group=g==='all'?files:files.filter(x=>x.group===g);if(!group.length)continue;fileHtml+='<div class="filegroup">'+(g==='all'?'比较中的文件':groupNames[g])+' · '+group.length+'</div>'+group.map(x=>'<button class="filerow '+(x.id===state.selected?'selected':'')+'" data-action="file" data-id="'+x.id+'" aria-label="查看 '+x.name+'"><span class="statusletter">'+(x.group==='untracked'?'U':'M')+'</span><span class="fileinfo"><span class="filename">'+x.name+'</span><span class="dirname">'+x.dir+'</span></span><span class="delta"><span class="plus">+'+x.plus+'</span> <span class="minus">−'+x.minus+'</span></span></button>').join('')}
const staged=state.files.filter(x=>x.group==='staged'&&!x.committed).length;let code='<div class="empty"><h3>当前范围没有变更</h3><p>切换到任务累计，仍可查看本次开发的整体修改。</p><button style="margin-top:12px" data-action="task-scope">查看任务累计</button></div>';
if(f){const oldLabel=state.scope==='working'?(f.group==='working'?'暂存区':'HEAD'):state.scope==='task'?'任务起点':'比较起点';const newLabel=state.scope==='working'?(f.group==='staged'?'暂存区':'工作目录'):'比较终点';code='<div class="filetitle"><strong>'+f.name+'</strong><span class="muted mono">'+f.dir+'</span><span class="spacer"></span><span class="delta"><span class="plus">+'+f.plus+'</span> <span class="minus">−'+f.minus+'</span></span></div><div class="codebar"><span class="tag">'+oldLabel+' → '+newLabel+'</span><span class="spacer"></span><button data-action="source">'+(state.source?'查看差异':'查看代码')+'</button><button data-action="inline">'+(state.inline?'左右对照':'行内对照')+'</button><button data-action="context" data-id="'+f.id+'">添加到对话</button></div><div class="summary"><strong>功能变化</strong><p>'+f.summary+'</p><p class="muted">基于示例差异的说明 · 行为仍需运行验证</p></div><div class="diffheads"><div>'+oldLabel+'</div><div>'+newLabel+'</div></div><div class="diff '+(state.inline?'inline':'')+' '+(state.source?'source-view':'')+'">'+f.rows.map(row=>{const [oldn,newn,value,kind]=row;const a=kind==='add'?'':value,b=kind==='del'?'':value;return '<div class="diffrow"><button class="diffcell '+(kind==='del'?'del':kind==='add'?'blank':'')+'" data-action="line" data-id="'+f.id+'" data-line="'+(oldn||newn)+'" aria-label="讨论 '+f.name+' 第 '+(oldn||newn)+' 行"><span class="ln">'+oldn+'</span><span class="codevalue">'+(kind==='del'?'− ':'  ')+esc(a)+'</span></button><button class="diffcell '+(kind==='add'?'add':kind==='del'?'blank':'')+' '+(kind==='same'?'same-right':'')+'" data-action="line" data-id="'+f.id+'" data-line="'+(newn||oldn)+'" aria-label="讨论 '+f.name+' 第 '+(newn||oldn)+' 行"><span class="ln">'+newn+'</span><span class="codevalue">'+(kind==='add'&&!state.source?'+ ':'  ')+esc(b)+'</span></button></div>'}).join('')+'</div><div class="codehint">点击具体行，将带版本的代码引用添加到右侧对话。</div>'}
return '<div class="subbar"><button class="mobile-files" data-action="drawer">文件</button><label class="muted" for="scope">比较范围</label><select id="scope" aria-label="比较范围">'+[['round','本轮变更'],['task','任务累计'],['working','未提交'],['branch','分支比较']].map(([id,n])=>'<option value="'+id+'" '+(id===state.scope?'selected':'')+'>'+n+'</option>').join('')+'</select><span class="muted">'+scopeText+'</span><span class="spacer"></span><button data-action="refresh">刷新</button></div><div class="code-layout"><aside class="files" id="files"><div class="filehead"><input id="fileSearch" aria-label="搜索文件" placeholder="搜索文件…" value="'+esc(state.search)+'"></div>'+fileHtml+'</aside><article class="code">'+code+'</article></div><div class="review-foot">'+(f&&state.scope==='working'?'<button data-action="stage" data-id="'+f.id+'">'+(f.group==='staged'?'取消暂存':'暂存此文件')+'</button>':'')+'<button data-action="show-checks">验证结果</button><button data-action="simulate" '+(state.permission==='read'?'disabled title="当前为只读讨论"':'')+'>模拟再改一轮</button><span class="spacer"></span><span class="muted">已暂存 '+staged+' 个文件</span><button class="primary" data-action="commit" '+(!staged?'disabled':'')+'>提交预览</button></div>';}
function renderChat(){document.querySelector('#chat').innerHTML='<div class="chat-head flex"><span>开发对话</span><span class="spacer"></span><button class="ghost" data-action="toggle-chat" aria-label="收起开发对话">×</button></div><div class="chat-body"><div class="user-msg">给报表列表增加导出功能，只导出当前筛选出来的数据。</div><div class="assistant-msg"><div class="flex"><span class="avatar">AI</span><strong>开发助手</strong></div><p>已完成一轮修改，你可以直接查看左侧差异。</p><ul><li>按钮使用当前筛选结果。</li><li>统一导出的列顺序。</li><li>补充导出范围测试。</li></ul><div class="msg-note">原有修改已纳入任务起点。新增变更按当前比较范围展示。</div><p><button class="linkbutton" data-action="show-checks">查看验证结果 ↗</button></p></div>'+state.extraMessages.map(m=>'<div class="assistant-msg"><div class="msg-note">'+esc(m)+'</div></div>').join('')+'</div><div class="chat-compose">'+(state.context?'<div class="chip"><span>'+esc(state.context)+'</span><span class="spacer"></span><button data-action="clear-context" aria-label="移除对话上下文">×</button></div>':'')+'<textarea id="draft" aria-label="开发对话输入" placeholder="描述调整，或点击差异中的某一行…">'+esc(state.draft)+'</textarea><div class="foot flex"><small>当前模型 · 沿用工作台</small><span class="spacer"></span><button class="primary" data-action="send">发送演示</button></div></div>';}
function renderVersions(){const bar=tabbar([['history','提交记录'],['branches','分支与目录'],['checkpoints','检查点']],state.versionTab,'version-tab','版本子选项卡');let body='';if(state.versionTab==='history'){body='<div class="flex between"><div><h2>提交记录</h2><p class="muted">查看版本只改变比较视图</p></div><span class="tag">feature/report-export</span></div><div class="timeline">'+state.commits.map(c=>'<div class="rowcard"><div class="flex"><strong>'+c.title+'</strong><span class="spacer"></span><span class="mono tag">'+c.hash+'</span></div><p>开发者 · '+c.time+'</p><div class="actions"><button data-action="commit-detail" data-hash="'+c.hash+'">查看详情</button><button data-action="branch-compare">与基础版本比较</button></div></div>').join('')+'</div>'}else if(state.versionTab==='branches'){body='<div class="flex between"><div><h2>分支与工作目录</h2><p class="muted">实际执行路径始终可见</p></div><button data-action="new-worktree">独立工作目录</button></div><div class="rowcard"><div class="flex"><strong>feature/report-export</strong><span class="tag good">当前分支</span></div><p class="mono">D:/Demo/report-export</p><p>关联任务：增加筛选结果导出 · '+state.files.filter(f=>!f.committed).length+' 个未提交文件</p><div class="actions"><button data-action="branch-compare">查看与 main 的差异</button></div></div><div class="rowcard"><div class="flex"><strong>main</strong><span class="tag">主工作目录</span></div><p class="mono">D:/Demo/report-app</p><p>保留原工作目录；不会随查看差异切换分支。</p><div class="actions"><button data-action="new-branch">从当前 HEAD 创建分支</button></div></div><div class="notice">独立目录隔离代码文件；运行端口、数据库与外部服务需要各自配置。</div>'}else{body='<div class="flex between"><div><h2>检查点</h2><p class="muted">本地恢复依据，不产生普通 Git 提交</p></div><button class="primary" data-action="checkpoint">保存检查点</button></div>'+state.checkpoints.map((c,i)=>'<div class="rowcard"><div class="flex"><strong>'+esc(c.name)+'</strong><span class="spacer"></span><span class="tag">修改 #'+c.rev+'</span></div><p>覆盖本任务记录的代码文件 · 排除运行数据与凭据</p><div class="actions"><button data-action="checkpoint-compare" data-index="'+i+'">与当前比较</button><button data-action="restore-preview" data-index="'+i+'">恢复预览</button></div></div>').join('')};return bar+'<div class="bodypad">'+body+'</div>';}
function renderRuns(){const bar=tabbar([['checks','验证记录'],['output','终端输出'],['trace','操作轨迹']],state.runTab,'run-tab','运行子选项卡');const [s,c]=status();let body='';if(state.runTab==='checks'){body='<div class="flex between wrap"><div><h2>验证记录</h2><p class="muted">当前代码：修改 #'+state.revision+' · 上次通过：修改 #'+state.verified+'</p></div><button class="primary" data-action="run">'+(state.running?'停止验证':'运行验证演示')+'</button></div><div class="rowcard"><div class="flex"><strong>类型检查</strong><span class="tag '+c+'">'+s+'</span></div><p>工作目录：D:/Demo/report-export</p><p>配置命令：pnpm typecheck · 示例退出码 '+(state.running?'—':state.testStatus==='cancelled'?'—':'0')+'</p><div class="actions"><button data-action="show-output">查看输出</button><button data-action="explain-run">围绕结果讨论</button></div></div>'+(state.revision!==state.verified?'<div class="notice">代码已在上次验证后变化。历史通过结果保留，当前内容需要重新验证。</div>':'')+'<div class="rowcard"><div class="flex"><strong>导出功能测试</strong><span class="tag">未运行</span></div><p>配置命令：pnpm test -- export · 示例入口</p><div class="actions"><button data-action="info" data-info="正式版从项目配置确认命令后执行，并单独保存结果。此草图仅模拟类型检查。">查看配置说明</button></div></div>'}else if(state.runTab==='output'){body='<h2>终端输出</h2><p class="muted">类型检查 · 修改 #'+state.verified+' · 以下为合成日志</p><pre class="logs">&gt; pnpm typecheck\n&gt; tsc --noEmit\n\n'+(state.running?'检查进行中…':state.testStatus==='cancelled'?'操作已取消，已产生输出保留。':'检查完成，无类型错误。\n进程退出码：0')+'</pre><button data-action="show-checks">返回验证记录</button>'}else{body='<h2>操作轨迹</h2><p class="muted">示例事件，最新操作在上方</p>'+[...state.events].reverse().map((e,i)=>'<div class="rowcard flex"><span class="tag">'+(i===0?'最近':'历史')+'</span><span>'+esc(e)+'</span></div>').join('')};return bar+'<div class="bodypad">'+body+'</div>';}

function action(a,b){const id=b?.dataset.id,f=state.files.find(x=>x.id===id);if(a==='toggle-chat'){state.chatOpen=!state.chatOpen;render();return}if(a==='file'){state.selected=id;render();return}if(a==='drawer'){document.querySelector('#files').classList.toggle('drawer-open');return}if(a==='source'){state.source=!state.source;render();return}if(a==='inline'){state.inline=!state.inline;render();return}if(a==='context'||a==='line'){state.context=f.name+(a==='line'?' · 第 '+b.dataset.line+' 行':'')+' · 修改 #'+state.revision;state.chatOpen=true;render();document.querySelector('#draft').focus();return}if(a==='clear-context'){state.context='';renderChat();return}if(a==='send'){if(!state.draft.trim()){toast('先输入希望调整或讨论的内容。');return}state.extraMessages.push('已收到演示消息：'+state.draft+'。正式版会携带当前片段与版本交给模型。');state.draft='';renderChat();return}if(a==='stage'){f.group=f.group==='staged'?(f.id==='test'?'untracked':'working'):'staged';state.events.push((f.group==='staged'?'暂存：':'取消暂存：')+f.name);render();toast('演示状态已更新，文件内容保持。');return}if(a==='task-scope'){state.scope='task';render();return}if(a==='refresh'){toast('演示内容已同步；正式版会重新读取 Git 状态。');return}if(a==='simulate'){state.revision++;state.round++;state.files[0].committed=false;state.files[0].group='working';state.files[0].plus++;state.files[0].summary='补充空结果提示文案，并保留当前筛选范围。';state.files[0].rows=state.files[0].rows.map(row=>row[2].includes('notify(')?[row[0],row[1],"      notify('没有符合筛选条件的记录');",row[3]]:row);state.events.push('第 '+state.round+' 轮：调整导出提示，代码变为修改 #'+state.revision);render();toast('已模拟代码变化：上次验证现在显示待复验。');return}if(a==='version-tab'){state.versionTab=b.dataset.value;render();return}if(a==='run-tab'){state.runTab=b.dataset.value;render();return}if(a==='branches'){state.tab='versions';state.versionTab='branches';render();return}if(a==='home'){setTab('develop');return}if(a==='branch-compare'){state.tab='changes';state.scope='branch';state.selected='export';render();return}if(a==='show-checks'||a==='show-output'){state.tab='runs';state.runTab=a==='show-output'?'output':'checks';render();return}if(a==='explain-run'){state.context='类型检查 · 修改 #'+state.verified;state.chatOpen=true;render();document.querySelector('#draft').focus();return}if(a==='run'){if(state.running){clearTimeout(runTimer);state.running=false;state.testStatus='cancelled';state.events.push('停止类型检查，输出已保留');render();return}const rev=state.revision;state.running=true;state.testStatus='running';state.events.push('开始类型检查 · 修改 #'+rev);render();runTimer=setTimeout(()=>{state.running=false;state.verified=rev;state.testStatus='passed';state.events.push('类型检查通过 · 对应修改 #'+rev);render();toast(rev===state.revision?'验证演示完成。':'验证期间代码发生变化，当前仍需复验。')},1800);return}if(a==='close'){closeDialog();return}if(a==='info'){toast(b.dataset.info);return}
if(a==='commit'){const selected=state.files.filter(x=>x.group==='staged'&&!x.committed);showDialog('提交预览','<div class="flex"><span class="tag">feature/report-export</span><span class="muted">'+selected.length+' 个暂存文件</span></div><div class="rowcard">'+selected.map(x=>'<p class="mono">'+x.dir+'/'+x.name+'　+'+x.plus+' −'+x.minus+'</p>').join('')+'</div><label class="field">提交说明<textarea id="commitMessage" rows="3">feat: 支持导出当前筛选结果</textarea></label><div class="notice">验证对象是工作目录，暂存内容需单独核对。此操作仅创建示例记录，不执行 Git。</div>','<button class="primary" data-action="confirm-commit">创建示例提交</button>');return}if(a==='confirm-commit'){const message=document.querySelector('#commitMessage').value.trim();if(!message){toast('填写提交说明。');return}const files=state.files.filter(x=>x.group==='staged'&&!x.committed);files.forEach(x=>x.committed=true);const hash='demo'+String(state.commits.length+1).padStart(3,'0');state.commits.unshift({hash,title:message,time:'刚刚 · 演示'});state.events.push('创建示例提交 '+hash+'，包含 '+files.length+' 个文件');closeDialog();render();toast('示例提交已创建；任务累计仍保留整体变化。');return}if(a==='checkpoint'){showDialog('保存检查点','<p>保存当前任务记录的文件状态，供后续比较。</p><label class="field">检查点名称<input id="checkpointName" value="导出已可用 · 修改 #'+state.revision+'"></label><p class="muted">覆盖 3 个示例代码文件，排除运行数据和凭据；不创建 Git 提交。</p>','<button class="primary" data-action="save-checkpoint">保存示例检查点</button>');return}if(a==='save-checkpoint'){const name=document.querySelector('#checkpointName').value.trim();if(!name){toast('填写检查点名称。');return}state.checkpoints.unshift({name,rev:state.revision});state.events.push('保存检查点：'+name);closeDialog();render();toast('检查点已保存在本次草图状态中。');return}if(a==='checkpoint-compare'||a==='restore-preview'){const cp=state.checkpoints[Number(b.dataset.index)];showDialog(a==='restore-preview'?'恢复预览':'检查点比较','<h3>'+esc(cp.name)+'</h3><p>检查点：修改 #'+cp.rev+' → 当前：修改 #'+state.revision+'</p><div class="rowcard"><p>ExportButton.tsx · '+(cp.rev===state.revision?'内容版本相同':'需比较内容与后续编辑')+'</p></div><div class="notice">正式版将逐文件核对后续修改与暂存区影响。此草图仅展示预览，不模拟无损恢复承诺。</div>','<button data-action="close">完成查看</button>');return}if(a==='commit-detail'){const cp=state.commits.find(x=>x.hash===b.dataset.hash);showDialog('提交详情','<h3>'+esc(cp.title)+'</h3><p class="mono">'+cp.hash+'</p><div class="rowcard"><p>本页展示提交元数据；点击比较可进入变更页。</p></div>','<button class="primary" data-action="detail-compare">查看示例差异</button>');return}if(a==='detail-compare'){closeDialog();action('branch-compare');return}if(a==='new-branch'||a==='new-worktree'){showDialog(a==='new-branch'?'创建分支':'独立工作目录','<label class="field">起始版本<input value="当前 HEAD · e3a96c1" readonly></label><label class="field">名称<input value="report-export-alternative"></label><div class="notice">源目录未提交修改不会自动带入。正式版创建目录后通过关联执行会话进入，保留原记录。</div>','<button data-action="close">保留当前目录</button>');return}if(a==='settings'){showDialog('项目设置','<div class="rowcard"><h3>报表应用</h3><p class="mono">D:/Demo/report-export</p><p>项目规则：AGENTS.md · 当前工作目录：独立目录</p></div><label class="field">验证命令<input value="pnpm typecheck" readonly></label><label class="field">外部编辑器<input value="复用工作台现有配置" readonly></label><p class="muted">演示只展示设置结构；正式版在同一入口保存项目配置及作用范围。</p>','<button data-action="close">完成查看</button>');return}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.tab){setTab(b.dataset.tab);return}if(b.dataset.action)action(b.dataset.action,b)});
document.addEventListener('change',e=>{if(e.target.id==='scope'){state.scope=e.target.value;state.search='';render()}if(e.target.id==='permission'){state.permission=e.target.value;render();toast(state.permission==='read'?'当前为只读讨论，模拟编辑已禁用。':'当前允许在任务范围内编辑。')}});
document.addEventListener('input',e=>{if(e.target.id==='draft')state.draft=e.target.value;if(e.target.id==='fileSearch'){const start=e.target.selectionStart;state.search=e.target.value;document.querySelector('#view').innerHTML=renderCode();const x=document.querySelector('#fileSearch');x.focus();x.setSelectionRange(start,start)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.querySelector('.dialog'))closeDialog();else if(innerWidth<740&&state.chatOpen){state.chatOpen=false;render()}return}if(e.key==='Tab'&&document.querySelector('.dialog')){const nodes=[...document.querySelectorAll('.dialog button:not([disabled]),.dialog input,.dialog textarea')];if(e.shiftKey&&document.activeElement===nodes[0]){e.preventDefault();nodes.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===nodes.at(-1)){e.preventDefault();nodes[0].focus()}}if(e.target.getAttribute('role')==='tab'&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){const nodes=[...e.target.parentElement.querySelectorAll('[role=tab]')],i=nodes.indexOf(e.target),next=e.key==='Home'?0:e.key==='End'?nodes.length-1:(i+(e.key==='ArrowRight'?1:-1)+nodes.length)%nodes.length;e.preventDefault();nodes[next].click();const target=nodes[next].dataset.tab?document.querySelector('[data-tab="'+nodes[next].dataset.tab+'"]'):document.querySelector('[data-action="'+nodes[next].dataset.action+'"][data-value="'+nodes[next].dataset.value+'"]');target?.focus()}});
document.querySelector('#theme').onclick=()=>{document.body.classList.toggle('dark');document.querySelector('#theme').textContent=document.body.classList.contains('dark')?'浅色':'深色'};document.querySelector('#reset').onclick=()=>location.reload();render();
</script></body></html>
